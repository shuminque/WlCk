<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>物品预警管理</title>
    <!-- LayUI CSS -->
    <link rel="stylesheet" href="/static/lib/layui-v2.8.17/css/layui.css" media="all">
    <!-- jQuery 库 -->
    <script src="/static/js/http_ajax.googleapis.com_ajax_libs_jquery_3.5.1_jquery.js"></script>
    <script src="/static/lib/layui-v2.8.17/layui.js" charset="utf-8"></script>
    <style>
        body {
            background-color: #f8f9fa;
        }
        .container {
            margin: 10px;
        }
    </style>
</head>
<body>
<div class="container">
    <button id="addNoticeAlertBtn" class="layui-btn">添加预警</button>
    <!-- 导入弹窗按钮 -->
    <button id="importExcelBtn" class="layui-btn layui-btn-normal">Excel导入</button>

    <!-- 弹出层内容 -->
    <div id="excelImportForm" style="display: none;">
        <form class="layui-form" lay-filter="excelImportForm" style="padding: 20px; max-width: 480px; margin: auto;">
            <div class="layui-form-item">
                <label class="layui-form-label">选择文件:</label>
                <div class="layui-input-block">
                    <input type="file" name="file" id="excelFileInput" accept=".xls,.xlsx" required lay-verify="required">
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-input-block">
                    <button type="submit" class="layui-btn" lay-submit lay-filter="importSubmitBtn">导入</button>
                </div>
            </div>
        </form>
    </div>

    <br>
    <table id="noticeAlertTable" lay-filter="noticeAlertTableFilter"></table>
</div>

<script type="text/html" id="actionBar">
    <a class="layui-btn layui-btn-xs" lay-event="edit">编辑</a>
    <a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="delete">删除</a>
</script>

<div id="addNoticeAlertForm" style="display: none; padding: 20px;">
    <form class="layui-form" lay-filter="addForm">
        <div class="layui-form-item" >
            <label class="layui-form-label">AT号:</label>
            <div class="layui-input-block">
                <input type="number" name="atId" required lay-verify="required" placeholder="请输入AT号" class="layui-input"  autocomplete="off">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">预警数量：</label>
            <div class="layui-input-block">
                <input type="number" name="alertQuantity" required lay-verify="required" placeholder="请输入预警数量" class="layui-input" autocomplete="off">
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-input-block">
                <button type="submit" class="layui-btn" lay-submit lay-filter="submitAddForm">提交</button>
            </div>
        </div>
    </form>
</div>

<!-- 编辑预警记录的表单模板 -->
<script type="text/template" id="editNoticeAlertTemplate">
    <form class="layui-form" lay-filter="editNoticeAlertFormFilter">
        <div class="layui-form-item">
            <div class="layui-input-block">
                <input type="hidden" name="id" required class="layui-input" readonly>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">AT号:</label>
            <div class="layui-input-block">
                <input type="number" name="atId" required lay-verify="required" placeholder="请输入AT号" class="layui-input" autocomplete="off">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">预警数量：</label>
            <div class="layui-input-block">
                <input type="number" name="alertQuantity" required lay-verify="required" placeholder="请输入预警数量" class="layui-input" autocomplete="off">
            </div>
        </div>
        <div class="layui-form-item" style="text-align: center;">
            <button class="layui-btn layui-btn-normal" lay-submit lay-filter="editNoticeAlertSubmitBtnFilter">
                更新
            </button>
        </div>
    </form>
</script>

<script>
    layui.use(['table', 'form', 'layer', 'jquery'], function(){
        var table = layui.table;
        var form = layui.form;
        var layer = layui.layer;
        var $ = layui.jquery;

        // 初始化表格
        table.render({
            elem: '#noticeAlertTable',
            url: '/noticeAlerts/', // 后端获取预警记录的接口
            parseData: function(res) {
                return {
                    "code": 0,
                    "msg": "",
                    "count": res.length,
                    "data": res
                };
            },
            cols: [ [
                {field: 'id', title: 'ID', sort: true ,hide:true},
                {field: 'atId', title: 'AT号', sort: true},
                {field: 'alertQuantity', title: '预警数量', sort: true},
                {field: 'mname', title: '品名', sort: true},
                {field: 'model', title: '规格'},
                {title: '操作', toolbar: '#actionBar'}
            ]],
            limits: [400,1000,50000],
            limit: 200,
            page: true
        });

        // 添加预警按钮
        $('#addNoticeAlertBtn').click(function() {
            layer.open({
                type: 1,
                title: '添加预警',
                content: $('#addNoticeAlertForm'),
                area: ['500px', '250px']
            });
        });
// 点击按钮打开弹窗
        $('#importExcelBtn').click(function () {
            layer.open({
                type: 1,
                title: 'Excel预警数据导入',
                area: ['500px'],
                content: $('#excelImportForm'),
                success: function () {
                    form.render(); // 渲染表单
                }
            });
        });

        var pendingImportFile = null;

        // 表单提交监听：先预览，不直接写入数据
        form.on('submit(importSubmitBtn)', function (data) {
            var fileInput = document.getElementById('excelFileInput');
            var file = fileInput.files[0];
            if (!file) {
                layer.msg('请选择文件', {icon: 2});
                return false;
            }

            var formData = new FormData();
            formData.append("file", file);

            pendingImportFile = file;
            $.ajax({
                url: '/noticeAlerts/import/preview',
                type: 'POST',
                data: formData,
                contentType: false,
                processData: false,
                success: function (res) {
                    showImportPreview(res.data || {});
                },
                error: function (xhr) {
                    var response = xhr.responseJSON || {};
                    layer.alert(response.message || '预览失败，请检查文件格式。', {
                        icon: 2,
                        title: '导入预览失败'
                    });
                }
            });

            return false;
        });

        function showImportPreview(preview) {
            var rows = preview.rows || [];
            var hasErrors = Number(preview.errorCount || 0) > 0;
            var html = '<div style="padding: 16px;">'
                + '<p>新增 <b>' + (preview.newCount || 0) + '</b> 条，替换 <b>' + (preview.replacementCount || 0)
                + '</b> 条，异常 <b>' + (preview.errorCount || 0) + '</b> 条。</p>'
                + '<table class="layui-table"><thead><tr><th>行号</th><th>AT号</th><th>现有数量</th><th>导入数量</th><th>结果</th><th>说明</th></tr></thead><tbody>';

            rows.forEach(function(row) {
                html += '<tr><td>' + escapeHtml(row.rowNumber) + '</td><td>' + escapeHtml(row.atId)
                    + '</td><td>' + escapeHtml(row.existingAlertQuantity)
                    + '</td><td>' + escapeHtml(row.incomingAlertQuantity)
                    + '</td><td>' + escapeHtml(row.action)
                    + '</td><td>' + escapeHtml(row.message) + '</td></tr>';
            });
            html += '</tbody></table>';
            if (hasErrors) {
                html += '<div class="layui-word-aux">存在异常行，修正 Excel 或合并重复预警记录后再导入。</div>';
            } else {
                html += '<div style="text-align: right;"><button type="button" class="layui-btn confirmImportBtn">确认导入</button></div>';
            }
            html += '</div>';

            layer.open({
                type: 1,
                title: 'Excel预警导入预览',
                area: ['900px', '620px'],
                content: html,
                success: function(layero, index) {
                    layero.find('.confirmImportBtn').on('click', function() {
                        confirmImport(index);
                    });
                }
            });
        }

        function confirmImport(previewLayerIndex) {
            if (!pendingImportFile) {
                layer.msg('导入文件已失效，请重新选择文件。', {icon: 2});
                return;
            }
            var formData = new FormData();
            formData.append('file', pendingImportFile);
            formData.append('replaceExisting', 'true');
            $.ajax({
                url: '/noticeAlerts/import',
                type: 'POST',
                data: formData,
                contentType: false,
                processData: false,
                success: function() {
                    pendingImportFile = null;
                    $('#excelFileInput').val('');
                    table.reload('noticeAlertTable');
                    layer.close(previewLayerIndex);
                    layer.closeAll('page');
                    layer.msg('导入成功！', {icon: 1, time: 1500});
                },
                error: function(xhr) {
                    var response = xhr.responseJSON || {};
                    layer.alert(response.message || '导入失败，请重新预览后再试。', {
                        icon: 2,
                        title: '导入失败'
                    });
                }
            });
        }

        function escapeHtml(value) {
            return $('<div>').text(value == null ? '' : value).html();
        }


        // 提交添加表单
        form.on('submit(submitAddForm)', function(data) {
            var formData = data.field;

            $.ajax({
                url: '/noticeAlerts/',
                type: 'GET',
                data: {atId: formData.atId},
                success: function(existingAlerts) {
                    if (existingAlerts && existingAlerts.length > 0) {
                        if (existingAlerts.length > 1) {
                            var duplicateQuantities = existingAlerts.map(function(alert) {
                                return alert.alertQuantity;
                            }).join('、');
                            layer.alert('AT号' + formData.atId + '已有' + existingAlerts.length
                                + '条预警记录（预警数量：' + duplicateQuantities
                                + '），请先合并重复配置后再修改。', {
                                icon: 2,
                                title: '存在重复预警配置'
                            });
                            return;
                        }

                        var existingAlert = existingAlerts[0];
                        if (Number(existingAlert.alertQuantity) === Number(formData.alertQuantity)) {
                            layer.msg('该AT号的预警数量已是' + formData.alertQuantity + '，无需替换。', {icon: 0});
                            return;
                        }
                        layer.confirm('AT号' + formData.atId + '当前预警数量为' + existingAlert.alertQuantity
                            + '，是否替换为' + formData.alertQuantity + '？', {
                            icon: 3,
                            title: '替换预警数量',
                            btn: ['替换', '取消']
                        }, function(index) {
                            replaceNoticeAlert(existingAlert.id, formData, index);
                        });
                        return;
                    }

                    createNoticeAlert(formData);
                },
                error: function() {
                    layer.msg('无法校验该AT号是否已有预警记录，请稍后重试。', {icon: 2, time: 2500});
                }
            });
            return false;
        });

        function createNoticeAlert(formData) {
            $.ajax({
                url: '/noticeAlerts/',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(formData),
                success: function() {
                    layer.msg('添加成功！', {icon: 1, time: 2000}, function () {
                        table.reload('noticeAlertTable');
                        form.val("addForm", {
                            'atId': "",
                            'alertQuantity': ""
                        });
                    });
                },
                error: function(xhr) {
                    var response = xhr.responseJSON || {};
                    layer.alert(response.message || '添加失败，请稍后重试。', {
                        icon: 2,
                        title: '添加预警失败'
                    });
                }
            });
        }

        function replaceNoticeAlert(id, formData, confirmLayerIndex) {
            $.ajax({
                url: '/noticeAlerts/' + id,
                type: 'PUT',
                contentType: 'application/json',
                data: JSON.stringify(formData),
                success: function() {
                    layer.close(confirmLayerIndex);
                    layer.msg('预警数量已替换！', {icon: 1, time: 1500});
                    table.reload('noticeAlertTable');
                    form.val("addForm", {
                        'atId': "",
                        'alertQuantity': ""
                    });
                },
                error: function() {
                    layer.msg('替换失败，请稍后重试。', {icon: 2, time: 2000});
                }
            });
        }

        // 编辑和删除操作
        table.on('tool(noticeAlertTableFilter)', function(obj) {
            var data = obj.data;
            var layEvent = obj.event;
            if (layEvent === 'edit') {
                editNoticeAlert(data);
            } else if (layEvent === 'delete') {
                deleteNoticeAlert(data.id);
            }
        });

        // 编辑预警记录
        function editNoticeAlert(data) {
            layer.open({
                type: 1,
                title: '编辑预警',
                content: $('#editNoticeAlertTemplate').html(),
                area: ['500px', '250px'],
                success: function(layero, index) {
                    form.val('editNoticeAlertFormFilter', {
                        'id': data.id,
                        'atId': data.atId,
                        'alertQuantity': data.alertQuantity
                    });
                }
            });
        }

        // 提交编辑表单
        form.on('submit(editNoticeAlertSubmitBtnFilter)', function(data) {
            var formData = data.field;
            $.ajax({
                url: '/noticeAlerts/' + formData.id, // 更新预警记录的接口
                type: 'PUT',
                contentType: 'application/json',
                data: JSON.stringify(formData),
                success: function(response) {
                    layer.msg('更新成功！', {icon: 1, time: 2000});
                    table.reload('noticeAlertTable');
                    layer.closeAll();
                },
                error: function(xhr, status, error) {
                    layer.msg('更新失败！', {icon: 2, time: 2000});
                }
            });
            return false;
        });

        // 删除预警记录
        function deleteNoticeAlert(id) {
            layer.confirm('确定要删除吗？', function (index) {
                $.ajax({
                    url: '/noticeAlerts/' + id,
                    type: 'DELETE',
                    success: function(res) {
                        layer.msg('删除成功！');
                        table.reload('noticeAlertTable');
                    },
                    error: function(err) {
                        layer.msg('删除失败！');
                    }
                });
                layer.close(index);
            });
        }
    });
</script>
</body>
</html>
